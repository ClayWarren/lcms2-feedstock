name: Native ARM64 runtime validation

on:
  push:
    branches: [codex/lcms2-native-runtime-validation]

permissions:
  contents: read
  actions: read

jobs:
  native-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      CI: github_actions
      CONFIG: win_arm64_
      BUILD_PLATFORM: win-64
      HOST_PLATFORM: win-arm64
      MINIFORGE_HOME: C:\lcms-validation\Miniforge
      CONDA_BLD_PATH: C:\lcms-validation\bld
      UPLOAD_PACKAGES: 'False'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Attest ARM64 runner
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($arch -ne 'Arm64') { throw "Expected ARM64 OS, got $arch" }
          Write-Host "OS architecture: $arch"
      - name: Retrieve previously built and tested ARM64 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\lcms-validation\bld\win-arm64 | Out-Null
          gh run download 34272470436 --repo ClayWarren/lcms2-feedstock --name lcms2-win-arm64 --dir C:\lcms-validation\bld\win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = 'C:\lcms-validation\bld\win-arm64\lcms2-2.19.1-hf15a58b_1.conda'
          if ((Get-FileHash $artifact -Algorithm SHA256).Hash -ne '4555ec612aa6b38e6c5b6454e90da1dec3154a12d9e7284c1a19abbe24199150') { throw 'Unexpected package hash' }
      - name: Provision conda tooling
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-win-64 -OutFile C:\lcms-validation\micromamba.exe
          & C:\lcms-validation\micromamba.exe create -y -r C:\lcms-validation\mamba -p C:\lcms-validation\Miniforge --override-channels -c conda-forge python=3.12 conda conda-index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install artifact with native Python
        shell: cmd
        run: |
          call C:\lcms-validation\Miniforge\Scripts\activate.bat
          set "CONDA_SUBDIR=win-arm64"
          call conda index C:\lcms-validation\bld
          if errorlevel 1 exit /b 1
          call conda create -y -p C:\lcms-validation\runtime --override-channels -c file:///C:/lcms-validation/bld -c conda-forge --strict-channel-priority "python=3.14.*=*_cp314" lcms2=2.19.1
          if errorlevel 1 exit /b 1
          if not exist C:\lcms-validation\runtime\python.exe exit /b 1
          C:\lcms-validation\runtime\python.exe validation\native-runtime.py
      - name: Retain package for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lcms2-win-arm64
          path: C:\lcms-validation\bld\win-arm64\lcms2-*.conda
          if-no-files-found: error
