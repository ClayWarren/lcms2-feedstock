name: Native ARM64 runtime validation

on:
  push:
    branches: [codex/lcms2-native-runtime-validation]

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      CI: github_actions
      CONFIG: win_arm64_
      BUILD_PLATFORM: win-64
      HOST_PLATFORM: win-arm64
      MINIFORGE_HOME: C:\lcms-validation\Miniforge
      CONDA_BLD_PATH: C:\lcms-validation\bld
      UPLOAD_PACKAGES: 'False'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Attest ARM64 runner
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($arch -ne 'Arm64') { throw "Expected ARM64 OS, got $arch" }
          Write-Host "OS architecture: $arch"
      - name: Build unchanged ARM64 recipe with cross tooling
        shell: cmd
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call .scripts\run_win_build.bat
      - name: Run package tests on ARM64
        shell: cmd
        run: |
          call C:\lcms-validation\Miniforge\Scripts\activate.bat
          set "CONDA_SUBDIR=win-arm64"
          for %%P in (C:\lcms-validation\bld\win-arm64\lcms2-*.conda) do (
            call conda-build --test "%%P" -c conda-forge
            if errorlevel 1 exit /b 1
          )
      - name: Install artifact with native Python
        shell: cmd
        run: |
          call C:\lcms-validation\Miniforge\Scripts\activate.bat
          set "CONDA_SUBDIR=win-arm64"
          call conda index C:\lcms-validation\bld
          if errorlevel 1 exit /b 1
          call conda create -y -p C:\lcms-validation\runtime --override-channels -c file:///C:/lcms-validation/bld -c conda-forge --strict-channel-priority python=3.12 lcms2=2.19.1
          if errorlevel 1 exit /b 1
          if not exist C:\lcms-validation\runtime\python.exe exit /b 1
          C:\lcms-validation\runtime\python.exe validation\native-runtime.py
      - name: Retain package for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lcms2-win-arm64
          path: C:\lcms-validation\bld\win-arm64\lcms2-*.conda
          if-no-files-found: error
